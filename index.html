<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SWDT VENDOR QC TOOL - Seawide Distribution</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: https:; img-src 'self' data: https: http:;" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('swdt-qc-theme');
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-app text-fg antialiased overflow-hidden select-none">
    <div id="root" class="h-screen w-screen overflow-hidden flex flex-col"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
